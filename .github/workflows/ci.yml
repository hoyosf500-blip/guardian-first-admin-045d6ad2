name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npx eslint src/lib/ src/hooks/ src/contexts/ --max-warnings 0
        continue-on-error: true

      # Reglas de hooks sobre TODO src/, BLOQUEANTE (sin continue-on-error).
      # El lint de arriba solo mira 3 carpetas y no tumba el build, así que un
      # hook mal puesto en un COMPONENTE pasaba el pipeline entero — y un hook
      # después de un early-return tira React #300/#310 y CAE LA PANTALLA
      # completa. Pasó el 25-ago-2026: CallView y NovedadView tenían un
      # useState/useRiesgoChat debajo del "¡Todos gestionados!" y una operadora
      # de Colombia quedó bloqueada cuando su cola llegó a cero.
      - name: Hooks rules (blocking)
        run: node scripts/check-hooks.mjs

      # Edge functions: `no-undef` BLOQUEANTE (sin continue-on-error).
      # Las de `supabase/functions` son Deno y NO pasan por tsc, ni por Vitest,
      # ni por el lint de arriba (que solo mira 3 carpetas de src/). Un
      # identificador usado y nunca declarado no se nota hasta que revienta en
      # produccion -- y ni ahi, porque Lovable no las redespliega al publicar.
      #
      # Paso el 30-ago-2026: al mover `restoreLocalGestiones` a `_shared/`, el
      # commit se llevo puestos `ymd()` (dropi-refresh-batch) y `mapOrder()`
      # (dropi-sync), que el resto de esos archivos SEGUIA usando. Las dos
      # funciones quedaron tirando "X is not defined": el boton «Sincronizar»
      # de Seguimiento devolvia 500. Estuvo roto desde el 30-ago y solo se vio
      # al desplegarlas esa noche.
      #
      # La regla `no-undef` para supabase/functions/** YA existia en
      # eslint.config.js desde el 4-ago-2026. El agujero no era la regla: era
      # que NADIE la corria. Este paso la arma.
      - name: Edge functions no-undef (blocking)
        run: npx eslint supabase/functions --no-warn-ignored

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
